name: CI

on:
  push:
    branches: [main, rebuild/core]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        include:
          - python-version: "3.11"
            runner: ubuntu-latest
            arch: x64
          - python-version: "3.12"
            runner: ubuntu-latest
            arch: x64
          # The daemon's production home is arm64 (Apple silicon via the Apple
          # container CLI), so the suite must actually run there rather than being
          # assumed portable. Everything is pure Python with prebuilt wheels for
          # both arches, and this is what proves it stays that way.
          - python-version: "3.12"
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mcp]"
          # Pin the linters to the repo's versions (.pre-commit-config.yaml) so CI
          # agrees with local formatting. `pip install black` alone pulls the
          # latest black, whose formatting drifts from the repo's 23.12.1 and would
          # spuriously flag already-formatted files (e.g. netadmin/visit/report.py).
          pip install "black==23.12.1" "isort==5.13.2" "flake8==7.0.0"
      - name: Tests with coverage gate
        run: |
          PYTHONPATH=. python -m pytest tests/ -q \
            --cov=netadmin --cov-report=term-missing:skip-covered --cov-fail-under=85
      - name: Format (black)
        run: black --check netadmin/ tests/netadmin/
      - name: Imports (isort)
        run: isort --check-only netadmin/ tests/netadmin/
      - name: Lint (flake8)
        run: flake8 netadmin/ tests/netadmin/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # This is a public repository: no credentials, no real network identifiers.
      # The scan is shape-based rather than a list of known field names, because a
      # controller fixture once shipped real guest_token values purely because the
      # sanitiser had no entry for that field.
      - name: Scan tracked files for secrets and PII
        run: python tools/scan_secrets.py

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    name: Image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web UI the image expects
        run: |
          cd web && npm ci && npm run build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Arch-neutral by design: python:3.12-slim is a manifest list and every
      # dependency ships prebuilt wheels for both, so this proves the claim on
      # every push rather than at deploy time on the mini.
      - name: Build for linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.netadmin
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
